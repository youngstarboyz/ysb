<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#351019">
  <meta name="robots" content="noindex,follow">
  <title>Page not found | YOUNG STAR BOYZ</title>
  <link rel="icon" type="image/webp" href="logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="premium.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:28px;text-align:center;background:#171313}
    .error-card{max-width:560px;padding:clamp(28px,6vw,56px);background:#35070B;border:1px solid #C9A24A;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
    .error-card .error-code{margin:0;color:#E8C46A;font:700 clamp(64px,15vw,112px)/1 'Playfair Display',Georgia,serif}
    .error-card h1{margin:8px 0 12px;color:#FFF4DE;font:600 clamp(26px,5vw,38px)/1.2 'Playfair Display',Georgia,serif}
    .error-card p{color:#D9C7A8;line-height:1.7}
    .error-card .button{margin-top:10px}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <img src="logo.webp" width="76" height="76" alt="Young Star Boyz logo" style="margin:0 auto;border-radius:50%">
      <p class="error-code">404</p>
      <h1 id="error-title">Page not found.</h1>
      <p>The page you are looking for may have moved or may no longer be available.</p>
      <a class="button button-gold" href="index.html">Return to homepage <span aria-hidden="true">→</span></a>
    </section>
  </main>
</body>
</html>
